services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # 5433 avoids clashing with a local Windows Postgres on 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qlu_news
    volumes:
      - qlu_news_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qlu_news"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qlu_news_pg:
